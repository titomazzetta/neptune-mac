name: Scorecard

# OpenSSF Scorecard: an independent, automated grade of this repository's
# supply-chain practices (pinned dependencies, token permissions, branch
# protection, signed releases, ...). Results are public on the Scorecard
# website and in this repo's Security tab; the README badge links to them.
# It changes nothing in the repository.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 1'     # weekly, Monday morning UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload results to the Security tab
      id-token: write          # publish results (signed) for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
