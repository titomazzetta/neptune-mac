name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: ShellCheck + syntax + bash 3.2 compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check (bash -n) all scripts
        run: |
          fail=0
          # tests/*.sh too: unit.sh once failed to parse on bash 3.2 and this
          # loop, which only looked at scripts/, had nothing to say about it.
          for f in scripts/*.sh tests/*.sh; do
            if bash -n "$f"; then
              echo "  ok  $f"
            else
              echo "FAIL  $f"; fail=1
            fi
          done
          exit $fail

      - name: ShellCheck all scripts
        run: shellcheck --shell=bash --severity=warning scripts/*.sh

      - name: Guard against bash 3.2 incompatibilities
        run: |
          # These patterns silently break on macOS's bash 3.2. Fail the build
          # if any appear, so a contributor/agent can't reintroduce them.
          fail=0

          # 'case' inside $(...) command substitution — 3.2 parser bug
          if grep -nE '\$\([^)]*\bcase\b' scripts/*.sh; then
            echo "ERROR: 'case' inside \$() command substitution (breaks bash 3.2)"; fail=1
          fi

          # Unguarded empty-array expansion under set -u:  "${ARR[@]}" without :+
          # Heuristic: flag "${...[@]}" NOT using the :+ guard, for review.
          if grep -nE '"\$\{[A-Za-z_][A-Za-z0-9_]*\[@\]\}"' scripts/*.sh \
               | grep -v ':+'; then
            echo "WARN: possible unguarded empty-array expansion — use \${ARR[@]:+\"\${ARR[@]}\"}"
            # warning only; some are provably non-empty. Reviewer confirms.
          fi

          # mapfile / readarray — unsupported in 3.2
          # Fragments, so the gate does not flag tests/lint.sh, which carries
          # the same check and would otherwise match on its own source line.
          BUILTINS='de''clare -A|\b(map''file|read''array)\b'
          if grep -nE "$BUILTINS" scripts/*.sh tests/*.sh; then
            echo "ERROR: associative arrays / mapfile / readarray are unsupported in bash 3.2"; fail=1
          fi

          # heredoc inside $( ) — same family as case-in-subshell. bash 3.2
          # scans a heredoc body for backticks and $( even when it is already
          # inside $( ), so a script that merely MENTIONS those characters is a
          # syntax error there. This runner's bash 5 parses it fine, which is
          # exactly why it needs a grep and not just `bash -n`.
          if grep -nE '\$\(.*<<' scripts/*.sh tests/*.sh; then
            echo "ERROR: heredoc inside \$() breaks bash 3.2 — move it to its own file"; fail=1
          fi

          exit $fail

      - name: Unit tests (parsing layer, fixture-driven)
        run: |
          # These need no macOS — every bug in the 2026-09 audit lived in text
          # processing and reproduces from captured command output. What they
          # deliberately do NOT do is pretend to verify macOS-only behaviour;
          # see the header of tests/unit.sh.
          ./tests/unit.sh

      - name: Renderer smoke test (JSON and HTML from a fixture)
        run: |
          # The renderer behind --json and --html is a python block inside
          # neptune.sh. Exercise it against the real-world findings fixture so a
          # broken format string or a bad regex fails here rather than on
          # someone's Mac at the end of a five-minute scan.
          set -e
          mkdir -p /tmp/rt
          awk -F'|' 'NF>=4 { key=tolower($4); gsub(/[0-9]+/,"#",key)
                if (length(key)>90) { key=substr(key,1,90); sub(/[^ ]*$/,"",key); sub(/ +$/,"",key) }
                printf "%s|%s|%s|%s|%s|0\n", $1,$2,$3,$4,key }' \
            tests/fixtures/findings-realworld.txt > /tmp/rt/scored.txt
          printf 'score|security|72|0\nscore|network|84|0\nscore|bloat|100|0\nscore|maintenance|96|0\ncount|attention|4\ncount|notice|2\ncount|unknown|1\ncount|info|0\ncount|acknowledged|0\n' > /tmp/rt/scores.txt
          { echo 'set -u'
            echo 'SCORED=/tmp/rt/scored.txt; SCORES=/tmp/rt/scores.txt'
            echo 'HISTORY=/tmp/rt/history.tsv; VKEY=needs_attention; VERDICT="NEEDS ATTENTION"'
            sed -n '/^render() {/,/^}$/p' scripts/neptune.sh
            echo 'render "$1" "$2"'
          } > /tmp/rt/drive.sh
          bash /tmp/rt/drive.sh json 0 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["findings"], "no findings"; print("  ok  JSON parses,", len(d["findings"]), "findings")'
          bash /tmp/rt/drive.sh json 1 | python3 -c 'import json,sys; json.load(sys.stdin); print("  ok  sanitized JSON parses")'
          bash /tmp/rt/drive.sh html 0 > /tmp/rt/out.html
          python3 - <<'CHECK'
          import re, html.parser
          h = open('/tmp/rt/out.html', encoding='utf-8').read()
          assert '<script' not in h.lower(), 'HTML report must contain no JavaScript'
          ext = re.findall(r'(?:src|href)\s*=\s*"(?!#)[^"]*"', h)
          assert not ext, 'HTML report must have no external references: %s' % ext
          assert '@import' not in h and 'url(' not in h, 'no external CSS resources'
          class P(html.parser.HTMLParser):
              def __init__(s): super().__init__(); s.stack=[]; s.bad=[]
              def handle_starttag(s,t,a):
                  if t not in ('meta','br','hr','img','input','link'): s.stack.append(t)
              def handle_endtag(s,t):
                  if s.stack and s.stack[-1]==t: s.stack.pop()
                  else: s.bad.append(t)
          p=P(); p.feed(h)
          assert not p.bad and not p.stack, 'unbalanced tags: %s %s' % (p.bad, p.stack)
          print('  ok  HTML is well formed, script-free and self-contained (%d bytes)' % len(h))
          CHECK

      - name: Blast radius of the destructive scripts
        run: |
          # The only automated check on uninstall.sh and remove_mackeeper.sh used
          # to be "the source contains a confirmation prompt" — which verifies
          # the gate exists and says nothing about what is behind it. This builds
          # a fake macOS layout with deliberately colliding decoy paths, and
          # asserts both that the target's files are found and that nothing else
          # is. It found a real over-match on its first run.
          ./tests/blast_radius.sh

      - name: Verify destructive scripts still require confirmation
        run: |
          # Guardrail: the two mutating scripts must contain an interactive
          # confirmation prompt. This is a coarse check, not a proof, but it
          # catches an accidental removal of the safety gate.
          fail=0
          for f in scripts/uninstall.sh scripts/remove_mackeeper.sh; do
            if grep -qE 'read -r?.*\[y/N\]|read -r?.*confirm' "$f"; then
              echo "  ok  $f has a confirmation prompt"
            else
              echo "FAIL  $f is missing its confirmation prompt"; fail=1
            fi
          done
          exit $fail
